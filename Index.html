<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#073b5c">
<title>Maa Vashno Clinic & Hospital</title>

<style>
:root{
--navy:#073b5c;
--navy2:#0b547a;
--teal:#10a6a6;
--mint:#eaf8f7;
--ink:#102b3b;
--muted:#617483;
--bg:#f5f8fa;
--card:#fff;
--line:#dfe8ed;
--shadow:0 18px 50px rgba(8,47,68,.10);
--r:22px
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
color:var(--ink);
background:var(--bg);
line-height:1.55
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.wrap{
max-width:1160px;
margin:auto;
padding:0 22px
}

.top{
background:var(--navy);
color:#fff;
font-size:13px
}

.top .wrap{
display:flex;
justify-content:space-between;
gap:14px;
padding:9px 22px
}

.top a{
color:#fff;
text-decoration:none
}

nav{
position:sticky;
top:0;
z-index:50;
background:rgba(255,255,255,.94);
backdrop-filter:blur(16px);
border-bottom:1px solid var(--line)
}

.navin{
height:76px;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:12px;
text-decoration:none;
color:var(--ink)
}

.logo{
width:44px;
height:44px;
border-radius:14px;
background:linear-gradient(145deg,var(--teal),var(--navy));
display:grid;
place-items:center;
color:white;
font-weight:900;
font-size:18px;
box-shadow:0 8px 20px #0b547a33
}

.brand b{font-size:15px}
.brand span{
display:block;
color:var(--muted);
font-size:11px
}

.links{
display:flex;
align-items:center;
gap:24px
}

.links a{
color:var(--ink);
text-decoration:none;
font-size:14px;
font-weight:700
}

.btn{
border:0;
border-radius:12px;
padding:11px 16px;
font-weight:800;
transition:.2s
}

.btn:hover{transform:translateY(-1px)}

.primary{
background:var(--navy);
color:#fff
}

.teal{
background:var(--teal);
color:#fff
}

.ghost{
background:#fff;
color:var(--navy);
border:1px solid var(--line)
}

.danger{
background:#fff0f0;
color:#a62020;
border:1px solid #ffd2d2
}

.small{
padding:8px 11px;
font-size:12px
}

.hero{
padding:76px 0 46px;
background:
radial-gradient(circle at 85% 15%,#19b7b733,transparent 30%),
linear-gradient(135deg,#062f4a,#0b5276 65%,#0a8e94);
color:#fff;
overflow:hidden
}

.heroGrid{
display:grid;
grid-template-columns:1.25fr .75fr;
gap:42px;
align-items:center
}

.eyebrow{
display:inline-flex;
gap:8px;
align-items:center;
padding:7px 11px;
border:1px solid #ffffff33;
background:#ffffff10;
border-radius:999px;
font-size:12px;
font-weight:800
}

.hero h1{
font-size:clamp(36px,5vw,64px);
line-height:1.02;
margin:18px 0;
letter-spacing:-2px
}

.hero p{
max-width:680px;
color:#dcecf5;
font-size:17px
}

.actions{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:26px
}

.hero .ghost{
background:#ffffff12;
border-color:#ffffff3d;
color:#fff
}

.infoCard{
background:#ffffff12;
border:1px solid #ffffff22;
border-radius:24px;
padding:22px;
box-shadow:0 25px 60px #001c2e33
}

.infoCard .row{
display:flex;
justify-content:space-between;
padding:13px 0;
border-bottom:1px solid #ffffff1f
}

.infoCard .row:last-child{border:0}

.infoCard small{color:#bcd5e3}
.infoCard b{font-size:14px}

section{padding:72px 0}

.sectionHead{
display:flex;
justify-content:space-between;
gap:20px;
align-items:end;
margin-bottom:26px
}

.kicker{
color:var(--teal);
font-size:12px;
font-weight:900;
letter-spacing:1.3px;
text-transform:uppercase
}

.sectionHead h2{
margin:5px 0 0;
font-size:32px;
letter-spacing:-1px
}

.muted{color:var(--muted)}

.stats{
background:#fff;
border-bottom:1px solid var(--line)
}

.statsGrid{
display:grid;
grid-template-columns:repeat(4,1fr)
}

.stat{
padding:23px;
border-right:1px solid var(--line)
}

.stat:last-child{border:0}

.stat b{font-size:25px}

.stat span{
display:block;
color:var(--muted);
font-size:12px;
margin-top:3px
}

.grid4{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px
}

.grid3{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px
}

.grid2{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:22px
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:var(--r);
padding:22px;
box-shadow:var(--shadow)
}

.icon{
width:44px;
height:44px;
border-radius:14px;
background:var(--mint);
display:grid;
place-items:center;
color:var(--teal);
font-weight:900
}

.service h3,.card h3{margin:13px 0 5px}

.service p{
margin:0;
color:var(--muted);
font-size:13px
}

.doctor{
display:grid;
grid-template-columns:92px 1fr;
gap:18px;
align-items:center
}

.docphoto{
width:92px;
height:92px;
border-radius:24px;
object-fit:cover;
background:linear-gradient(145deg,#0a7c94,#0c3d60);
display:grid;
place-items:center;
color:white;
font-size:28px;
font-weight:900
}

.doctor .tag{
display:inline-block;
background:var(--mint);
color:#087b7c;
padding:4px 8px;
border-radius:999px;
font-size:10px;
font-weight:800
}

.doctor h3{margin:6px 0 2px}

.doctor p{
margin:2px 0;
color:var(--muted);
font-size:12px
}

.updates{display:grid;gap:12px}

.update{
padding:18px 20px;
border:1px solid var(--line);
border-radius:18px;
background:#fff;
display:flex;
justify-content:space-between;
gap:20px
}

.update h3{margin:0 0 4px}

.update p{
margin:0;
color:var(--muted);
font-size:13px
}

.date{
font-size:11px;
color:var(--teal);
font-weight:800;
white-space:nowrap
}

.mapbox{
min-height:330px;
border-radius:28px;
background:linear-gradient(145deg,#dff4f1,#e8f0f5);
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:35px
}

.mapinner{max-width:520px}
.mappin{font-size:45px}

.contact{
background:var(--navy);
color:#fff
}

.contact .muted{color:#bcd1de}

.contactGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:24px
}

.contactCard{
background:#ffffff0d;
border:1px solid #ffffff18;
border-radius:22px;
padding:25px
}

.contact a{color:#fff}

.footer{
background:#052b43;
color:#a9c3d1;
padding:28px 0;
font-size:12px
}

.footer .wrap{
display:flex;
justify-content:space-between;
gap:15px
}

.admin{
display:none;
background:#eef5f7;
min-height:100vh
}

.admin.on{display:block}

.adminbar{
background:var(--navy);
color:#fff;
padding:18px 0
}

.adminbar .wrap{
display:flex;
align-items:center;
justify-content:space-between
}

.adminGrid{
display:grid;
grid-template-columns:260px 1fr;
gap:22px;
padding:26px 22px
}

.side{
background:#fff;
border:1px solid var(--line);
border-radius:20px;
padding:14px;
height:max-content;
position:sticky;
top:92px
}

.side button{
display:block;
width:100%;
text-align:left;
background:none;
border:0;
padding:12px;
border-radius:10px;
font-weight:750;
color:var(--ink)
}

.side button.active,
.side button:hover{
background:var(--mint);
color:#087b7c
}

.panel{
background:#fff;
border:1px solid var(--line);
border-radius:20px;
padding:24px
}

.panel h2{margin-top:0}

.formgrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px
}

.field{
display:grid;
gap:6px
}

.field.full{grid-column:1/-1}

.field label{
font-size:12px;
font-weight:800
}

.field input,
.field textarea,
.field select{
width:100%;
border:1px solid #d5e0e5;
border-radius:11px;
padding:11px 12px;
outline:none;
background:#fff
}

.field input:focus,
.field textarea:focus{
border-color:var(--teal);
box-shadow:0 0 0 3px #10a6a61a
}

.toolbar{
display:flex;
justify-content:space-between;
gap:12px;
align-items:center;
margin-bottom:18px
}

.table{
width:100%;
border-collapse:collapse
}

.table th,
.table td{
text-align:left;
padding:11px 8px;
border-bottom:1px solid var(--line);
font-size:12px;
vertical-align:middle
}

.miniimg{
width:42px;
height:42px;
border-radius:10px;
object-fit:cover;
background:#dceef0
}

.modal{
display:none;
position:fixed;
inset:0;
background:#061f2dcc;
z-index:100;
align-items:center;
justify-content:center;
padding:20px
}

.modal.on{display:flex}

.modalbox{
background:#fff;
border-radius:22px;
max-width:680px;
width:100%;
max-height:90vh;
overflow:auto;
padding:24px
}

.toast{
position:fixed;
right:18px;
bottom:18px;
background:#092f48;
color:#fff;
padding:13px 16px;
border-radius:13px;
box-shadow:var(--shadow);
display:none;
z-index:200;
font-size:13px
}

.toast.on{display:block}

.public{display:block}
.public.hide{display:none}

.adminLogin{
max-width:420px;
margin:70px auto;
background:#fff;
padding:28px;
border-radius:24px;
border:1px solid var(--line);
box-shadow:var(--shadow)
}

@media(max-width:900px){
.heroGrid,
.contactGrid,
.adminGrid{grid-template-columns:1fr}

.grid4{grid-template-columns:repeat(2,1fr)}
.grid3{grid-template-columns:1fr 1fr}
.links{display:none}
.side{position:static}
.statsGrid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
.wrap{padding:0 16px}
.hero{padding:52px 0 36px}
.hero h1{font-size:42px}
.grid4,.grid3,.grid2{grid-template-columns:1fr}
section{padding:52px 0}
.sectionHead{display:block}
.formgrid{grid-template-columns:1fr}
.field.full{grid-column:auto}
.doctor{grid-template-columns:72px 1fr}
.docphoto{
width:72px;
height:72px
}
}
</style>
</head>

<body>

<div id="publicApp" class="public"></div>
<div id="adminApp" class="admin"></div>
<div id="toast" class="toast"></div>

<script>

const KEY='mvhospital_v4';

const DEFAULT={
settings:{
name:'Maa Vashno Clinic & Hospital',
short:'Maa Vashno Clinic & Hospital',
tagline:'Compassionate care. Modern facilities. Trusted locally.',
address:'Prakash Nagar, Bhutiyatad, Sanik Chauraha, Ghazipur 233001',
phone:'',
email:'',
hours:'Open 24 hours',
description:'A clean, professional hospital information website for doctors, services, updates and contact information.'
},

doctors:[
{
id:'doctor-1',
name:'MK YADAV',
speciality:'General & GI Surgery',
degrees:'MBBS (BHU) | MS (BHU) • FIAGES | FISCP | MCLS',
fellowship:'Fellowship in Advanced GI Endoscopy & ERCP (FAGIE)',
member:'Member of Society of GI Endoscopy of India.',
photo:'',
available:'By appointment'
}
],

services:[
{
id:'service-1',
title:'Doctor Consultation',
text:'Doctor information, availability and appointment contact.'
},
{
id:'service-2',
title:'General Care',
text:'Hospital information and patient-support details in one place.'
},
{
id:'service-3',
title:'Surgical Care',
text:'Information about available surgical and specialist services.'
},
{
id:'service-4',
title:'Emergency Contact',
text:'Quick access to hospital contact and location.'
}
],

news:[
{
id:'news-1',
title:'Hospital updates',
text:'New announcements and important hospital information can be posted here.',
date:'2026-09-23'
}
],

ads:[
{
id:'ad-1',
title:'Maa Vashno Clinic & Hospital',
text:'Trusted local healthcare information and doctor updates.',
image:''
}
],

adminPin:'mvc9695'
};

let db=load();

function load(){
try{
const x=JSON.parse(localStorage.getItem(KEY));

if(x){
return merge(DEFAULT,x);
}

return structuredClone(DEFAULT);

}catch(e){
return structuredClone(DEFAULT);
}
}

function merge(a,b){
return {
...a,
...b,
settings:{
...a.settings,
...(b.settings||{})
}
};
}

function save(){
localStorage.setItem(KEY,JSON.stringify(db));
}

function toast(t){
const el=document.getElementById('toast');

el.textContent=t;
el.classList.add('on');

setTimeout(()=>{
el.classList.remove('on');
},2200);
}

function esc(s=''){
return String(s).replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m]));
}

function initials(n='MV'){
return n
.split(/\s+/)
.map(x=>x[0])
.slice(0,2)
.join('')
.toUpperCase();
}

function maps(){

const q=encodeURIComponent(db.settings.address);

window.open(
'https://www.google.com/maps/search/?api=1&query='+q,
'_blank'
);

}

function call(){

if(db.settings.phone){

location.href='tel:'+db.settings.phone;

}else{

toast('Add hospital phone number from Admin.');

}

}

function whatsapp(){

if(db.settings.phone){

window.open(
'https://wa.me/'+db.settings.phone.replace(/\D/g,''),
'_blank'
);

}else{

toast('Add hospital phone number from Admin.');

}

}

const s=db.settings;

document.getElementById('publicApp').innerHTML=`

${esc(s.hours)}

</div>

onclick="document.querySelector('#doctors').scrollIntoView()">

</div>

</div>

<div class="infoCard">

<div class="row">
<small>Location</small>
<b>Ghazipur</b>
</div>

<div class="row">
<small>Address</small>
<b>${esc(s.address)}</b>
</div>

<div class="row">
<small>Contact</small>
<b>${esc(s.phone||'Add phone in Admin')}</b>
</div>

<div class="row">
<small>Appointments</small>
<b>Contact hospital</b>
</div>

</div>

</div>

</header>

<div class="stats">

<div class="wrap statsGrid">

<div class="stat">
<b>${db.doctors.length}</b>

</div>

<div class="stat">

</div>

<b>${db.news.length}</b>

</div>

</div>

<section id="doctors">

</div>

</section>

<section id="services" style="background:#fff">

</div>

<div class="grid4">

${db.services.map((x,i)=>`

</div>

</section>

<section id="updates">

</div>

</div>

<div class="updates">

${db.news.map(n=>`

<article class="update">

<div>

</div>

<span class="date">
${esc(n.date)}
</span>

</article>

`).join('')}

</div>

</div>

</section>

<section style="background:#fff">

<div class="wrap">

<div class="sectionHead">

<div>

<div class="kicker">Hospital ads</div>

<h2>Featured information</h2>

</div>

</div>

<div class="grid3">

${db.ads.map(a=>`

<article class="card">

${
a.image
?
`<img
src="${a.image}"
style="width:100%;height:170px;object-fit:cover;border-radius:16px;margin-bottom:12px">`
:''
}

<h3>${esc(a.title)}</h3>

<p class="muted">${esc(a.text)}</p>

</article>

`).join('')}

</div>

</div>

</section>

<section id="location">

<div class="wrap">

<div class="sectionHead">

<div>

<div class="kicker">Find us</div>

<h2>Hospital location</h2>

<p class="muted">${esc(s.address)}</p>

</div>

<button
class="btn primary"
onclick="maps()">
Open Google Maps
</button>

</div>

<div class="mapbox">

<div class="mapinner">

<div class="mappin">⌖</div>

<h3>${esc(s.short)}</h3>

<p class="muted">${esc(s.address)}</p>

<button
class="btn teal"
onclick="maps()">
Get directions
</button>

</div>

</div>

</div>

</section>

<section class="contact">

<div class="wrap contactGrid">

<div>

<div class="kicker">Contact</div>

<p class="muted">
${esc(s.description)}
</p>

<div class="actions">

<button
class="btn teal"
onclick="call()">
Call
</button>

<button
class="btn ghost"

</button>

</div>

<div class="contactCard">

<h3>${esc(s.short)}</h3>

</section>

<footer class="footer">

<div class="wrap">

<span>
© ${new Date().getFullYear()}
${esc(s.short)}
</span>

Website managed through Admin
</span>

</div>

`;

}

function showAdmin(){

document.getElementById('publicApp')
.classList.add('hide');

document.getElementById('adminApp')
.classList.add('on');

renderAdminLogin();

}

function exitAdmin(){

document.getElementById('adminApp')
.classList.remove('on');

document.getElementById('publicApp')
.classList.remove('hide');

renderPublic();

window.scrollTo(0,0);

}

function renderAdminLogin(){

document.getElementById('adminApp').innerHTML=`

<div class="adminbar">

<div class="wrap">

<b>Hospital Admin</b>

<button
class="btn ghost small"
onclick="exitAdmin()">
View website
</button>

</div>

</div>

<div class="adminLogin">

<div class="kicker">
Secure admin dashboard
</div>

<h2>Admin login</h2>

<p class="muted">
Enter your hospital admin PIN.
</p>

<div class="field">

<label>ADMIN PIN</label>

<input
id="pin"
type="password"
inputmode="text"
autocomplete="off">

</div>

<br>

<button
